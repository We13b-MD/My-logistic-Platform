version: '3.8'

services:
  # ─── 1. PostgreSQL Database Service ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: logistel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logistel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistel_password}
      POSTGRES_DB: ${POSTGRES_DB:-logistel_prod}
    ports:
      - "127.0.0.1:5432:5432" # Bound locally for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistel_user} -d ${POSTGRES_DB:-logistel_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Redis Cache & Queue Service (BullMQ) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: logistel_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379" # Bound locally for security
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Express Node.js Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistel_api
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 4. Caddy Reverse Proxy & Automatic SSL (Let's Encrypt) ─────────────────
  caddy:
    image: caddy:2-alpine
    container_name: logistel_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
