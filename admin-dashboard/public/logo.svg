<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradient: Electric Teal to Sky Cyan -->
    <linearGradient id="speed-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Wing Highlight Gradient -->
    <linearGradient id="wing-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Speed Motion Trail Gradient -->
    <linearGradient id="trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="squircle-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="teal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14b8a6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Midnight Squircle Glass Badge -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="#060c19" stroke="url(#squircle-border)" stroke-width="2" filter="url(#teal-glow)" />

  <!-- Motion Velocity Trails behind the 'L' Wing -->
  <path d="M18 42 C 28 32, 42 28, 56 28" stroke="url(#trail-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M14 54 C 26 44, 40 40, 58 40" stroke="url(#trail-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Main Aerodynamic 'L' Speed Wing & Telematics Pin Body -->
  <!-- Sweeping 'L' Stem transitioning up into a GPS Teardrop Pin Top -->
  <path
    d="M32 78 C 30 78, 28 76, 28 73 L 28 40 C 28 26, 38 16, 52 16 C 64 16, 74 25, 74 37 C 74 48, 62 58, 48 68 L 74 68 C 77 68, 79 71, 78 74 L 76 77 C 75 78, 73 78, 71 78 Z"
    fill="url(#speed-grad-primary)"
  />

  <!-- Wing Bevel Highlight Overlay -->
  <path
    d="M34 76 L 34 40 C 34 29, 42 20, 52 20 C 61 20, 69 27, 69 36 C 69 45, 59 54, 46 63 L 68 63 C 71 63, 73 65, 72 68 Z"
    fill="url(#wing-light)"
    opacity="0.3"
  />

  <!-- GPS Telematics Radar Target Core (Outer Pulse Ring + Center Node Pin) -->
  <circle cx="52" cy="34" r="10" fill="#060c19" opacity="0.85" />
  <circle cx="52" cy="34" r="7" stroke="url(#wing-light)" stroke-width="2" fill="none" />
  <circle cx="52" cy="34" r="3.5" fill="#38bdf8" />
  <circle cx="52" cy="34" r="1.5" fill="#ffffff" />

  <!-- Speed Arrow Head integrated at the front tip of the L base -->
  <path d="M70 78 L 84 73 L 70 68 L 73 73 Z" fill="#38bdf8" />
</svg>
